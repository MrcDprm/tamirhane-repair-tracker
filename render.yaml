# Render Blueprint: Dockerfile'dan derlenen web servisi (ücretsiz plan, Frankfurt). Veritabanı Neon'da (Frankfurt).
# Gizli değerler "sync: false": Render bir kez sorar, repoya hiç girmez.
services:
  - type: web
    name: tamirhane
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:mrcdprmm@hotmail.com"
      - key: EMAIL_FROM
        value: "Tamirhane <tamirhane@miracdeprem.com>"
      # Render, X-Forwarded-For'un sonuna kendi vekil sunucusunun IP'sini ekler; oradan okunan adres herkes için
      # aynı olurdu. Render'ın önündeki Cloudflare gerçek istemci IP'sini bu başlığa yazar (istemcinin gönderdiğini ezer).
      - key: CLIENT_IP_HEADER
        value: "CF-Connecting-IP"
      - key: PUBLIC_ORIGIN
        value: "https://tamirhane.miracdeprem.com"
      # onrender.com adresi Render'da kapatıldı; site sadece kendi alan adından açılır.
      - key: AllowedHosts
        value: "tamirhane.miracdeprem.com"
