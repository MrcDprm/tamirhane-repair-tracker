# Render Blueprint: Dockerfile'dan derlenen web servisi (ücretsiz plan, Frankfurt). Veritabanı Neon'da (Frankfurt).
# Gizli değerler "sync: false": Render bir kez sorar, repoya hiç girmez.
services:
  - type: web
    name: tamirhane
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:mrcdprmm@hotmail.com"
      - key: EMAIL_FROM
        value: "Tamirhane <tamirhane@miracdeprem.com>"
      - key: PUBLIC_ORIGIN
        value: "https://tamirhane.miracdeprem.com"
      # Render servis adı alınmışsa sonuna ek koyar (ör. tamirhane-ab12.onrender.com); öyleyse burası güncellenir.
      - key: AllowedHosts
        value: "tamirhane.miracdeprem.com;tamirhane.onrender.com"
